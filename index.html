<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CJ - Full Stack Developer</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.emailjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://api.emailjs.com https://generativelanguage.googleapis.com;">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
            colors: {
              primary: {
                DEFAULT: "#2b2bee",
                foreground: "#ffffff",
                hover: "#2020b0",
                glow: "rgba(43, 43, 238, 0.3)"
              },
              background: {
                DEFAULT: "#101022", // Main background
                dark: "#0a0a15",    // Darker sections
                card: "#181825",    // Cards surface
                overlay: "rgba(16, 16, 34, 0.8)"
              },
              surface: {
                DEFAULT: "#1c1c27",
                hover: "#252532",
                active: "#2d2d3d",
                lighter: "#2d2d3d"
              },
              border: {
                DEFAULT: "rgba(255, 255, 255, 0.08)",
                hover: "rgba(255, 255, 255, 0.15)"
              },
              text: {
                primary: "#ffffff",
                secondary: "#9d9db9",
                muted: "#63637e",
                accent: "#2b2bee"
              },
              accent: {
                cyan: "#00f0ff",
                pink: "#ff007a",
                purple: "#6c2bd9"
              }
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
              body: ["Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            borderRadius: { 
              "DEFAULT": "0.5rem", // Standard 8px
              "lg": "0.75rem", // 12px
              "xl": "1rem", // 16px
              "full": "9999px" 
            },
            boxShadow: {
              "card": "0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)",
              "card-hover": "0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)",
              "glow": "0 0 15px rgba(43, 43, 238, 0.5)", // Primary glow
              "glow-sm": "0 0 8px rgba(43, 43, 238, 0.3)", // Subtle glow
            },
            animation: {
                'fade-in-up': 'fade-in-up 0.6s ease-out forwards',
                'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
                'fade-in-up': {
                    '0%': { opacity: '0', transform: 'translateY(20px)' },
                    '100%': { opacity: '1', transform: 'translateY(0)' },
                }
            }
          },
        }
      }
    </script>
    <style>
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: #101022;
        color: white;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #101022; 
      }
      ::-webkit-scrollbar-thumb {
        background: #2b2bee; 
        border-radius: 4px;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>

</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
